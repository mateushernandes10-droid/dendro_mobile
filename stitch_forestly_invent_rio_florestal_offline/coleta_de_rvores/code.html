<script>
    // Simple Increment/Decrement Logic for Demo
    const updateInput = (id, delta) => {
        const input = document.getElementById(id);
        let val = parseFloat(input.value) || 0;
        val = (val + delta).toFixed(1);
        if (val < 0) val = 0;
        input.value = val;
        
        // Brief visual feedback
        input.parentElement.classList.add('bg-primary-fixed/20');
        setTimeout(() => input.parentElement.classList.remove('bg-primary-fixed/20'), 150);
    };

    document.querySelector('.dap-plus').addEventListener('click', () => updateInput('dap-input', 0.5));
    document.querySelector('.dap-minus').addEventListener('click', () => updateInput('dap-input', -0.5));
    
    document.querySelector('.alt-plus').addEventListener('click', () => updateInput('alt-input', 0.5));
    document.querySelector('.alt-minus').addEventListener('click', () => updateInput('alt-input', -0.5));
</script></main>

<p class="font-body-md text-body-md text-on-surface-variant">Selecione o formato e as parcelas para gerar o relatório final de campo.</p>
</div>
<section class="flex flex-col gap-stack-md px-base">
<h3 class="font-label-md text-label-md text-on-surface uppercase opacity-80">Formato do Arquivo</h3>
<div class="grid grid-cols-1 gap-stack-sm" id="format-selection">
<label class="relative flex items-center p-stack-md rounded-xl cursor-pointer transition-colors ring-2 ring-primary bg-surface" data-format="pdf">

<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-error-container text-on-error-container mr-stack-md shrink-0">
<span class="material-symbols-outlined text-[24px]">picture_as_pdf</span>
</div>
<div class="flex-1 min-w-0">
<span class="block font-headline-sm text-headline-sm text-on-surface truncate">Relatório PDF</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant truncate">Formatado para impressão e leitura</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
<label class="relative flex items-center p-stack-md bg-surface-container rounded-xl cursor-pointer transition-colors" data-format="csv">
<input class="peer sr-only" name="export-format" type="radio" value="csv">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-secondary-container text-on-secondary-container mr-stack-md shrink-0">
<span class="material-symbols-outlined text-[24px]">csv</span>
</div>
<div class="flex-1 min-w-0">
<span class="block font-headline-sm text-headline-sm text-on-surface truncate">Dados Brutos (CSV)</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant truncate">Ideal para análise em software GIS</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
<label class="relative flex items-center p-stack-md bg-surface-container rounded-xl cursor-pointer transition-colors" data-format="excel">
<input class="peer sr-only" name="export-format" type="radio" value="excel">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-tertiary-container text-on-tertiary-container mr-stack-md shrink-0">
<span class="material-symbols-outlined text-[24px]">table_chart</span>
</div>
<div class="flex-1 min-w-0">
<span class="block font-headline-sm text-headline-sm text-on-surface truncate">Planilha (Excel)</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant truncate">Tabelas de cubagem rigorosa</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
</div>
</section>
<section class="flex flex-col gap-stack-md px-base flex-1">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-on-surface uppercase opacity-80">Seleção de Dados</h3>
<button class="font-label-md text-label-md text-primary" id="select-all-btn">Selecionar Todos</button>
</div>
<div class="flex flex-col gap-stack-sm" id="stand-selection">
<label class="flex items-center p-stack-md bg-surface-container rounded-xl min-h-[64px]">
<input checked="" class="stand-checkbox w-6 h-6 rounded border-2 border-outline checked:bg-primary checked:border-primary text-primary focus:ring-0 cursor-pointer mr-stack-md" type="checkbox">
<div class="flex-1 min-w-0 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Talhão 01 - Pinus Taeda</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">32 Parcelas • 24.5 ha</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-variant px-2 py-1 rounded">PRC-A4</span>
</div>
</label>
<label class="flex items-center p-stack-md bg-surface-container rounded-xl min-h-[64px]">
<input checked="" class="stand-checkbox w-6 h-6 rounded border-2 border-outline checked:bg-primary checked:border-primary text-primary focus:ring-0 cursor-pointer mr-stack-md" type="checkbox">
<div class="flex-1 min-w-0 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Talhão 02 - E. Grandis</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">18 Parcelas • 12.0 ha</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-variant px-2 py-1 rounded">PRC-B2</span>
</div>
</label>
<label class="flex items-center p-stack-md bg-surface-container rounded-xl min-h-[64px]">
<input class="stand-checkbox w-6 h-6 rounded border-2 border-outline checked:bg-primary checked:border-primary text-primary focus:ring-0 cursor-pointer mr-stack-md" type="checkbox">
<div class="flex-1 min-w-0 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Área de Preservação (APP)</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Levantamento Florístico • 8.2 ha</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-variant px-2 py-1 rounded">APP-01</span>
</div>
</label>
</div>
</section>
<div class="px-base mt-stack-lg sticky bottom-safe pt-stack-md bg-gradient-to-t from-surface via-surface to-transparent">
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-md text-headline-md rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-[0.98]" id="export-btn">
<span class="material-symbols-outlined">share</span>
<span class="">Compartilhar Relatório</span>
</button>
</div>
<!-- Success Overlay -->
<div class="fixed inset-0 z-50 bg-surface/90 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300" id="success-overlay">
<div class="w-24 h-24 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-stack-lg scale-50 transition-transform duration-500" id="success-icon">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm text-center">Arquivo Gerado</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[80%]">O relatório foi salvo localmente e está pronto para compartilhamento.</p>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const selectAllBtn = document.getElementById('select-all-btn');
    const checkboxes = document.querySelectorAll('.stand-checkbox');
    const exportBtn = document.getElementById('export-btn');
    const successOverlay = document.getElementById('success-overlay');
    const successIcon = document.getElementById('success-icon');
    
    // Format Selection Styling
    const formatLabels = document.querySelectorAll('#format-selection label');
    formatLabels.forEach(label => {
      label.addEventListener('click', () => {
        // Reset all
        formatLabels.forEach(l => {
          l.classList.remove('ring-2', 'ring-primary', 'bg-surface');
          l.classList.add('bg-surface-container');
        });
        // Set active
        label.classList.add('ring-2', 'ring-primary', 'bg-surface');
        label.classList.remove('bg-surface-container');
      });
    });
    
    // Initialize active format style
    const checkedRadio = document.querySelector('input[name="export-format"]:checked');
    if(checkedRadio) {
      const parentLabel = checkedRadio.closest('label');
      parentLabel.classList.add('ring-2', 'ring-primary', 'bg-surface');
      parentLabel.classList.remove('bg-surface-container');
    }

    // Select All functionality
    let allSelected = false;
    selectAllBtn.addEventListener('click', () => {
      allSelected = !allSelected;
      checkboxes.forEach(cb => cb.checked = allSelected);
      selectAllBtn.textContent = allSelected ? "Desmarcar Todos" : "Selecionar Todos";
      updateExportBtnState();
    });

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateExportBtnState);
    });

    function updateExportBtnState() {
      const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
      exportBtn.disabled = !anyChecked;
      if(!anyChecked) {
        exportBtn.classList.add('opacity-50');
      } else {
        exportBtn.classList.remove('opacity-50');
      }
    }
    
    // Export Animation
    exportBtn.addEventListener('click', () => {
      if(exportBtn.disabled) return;
      
      const originalContent = exportBtn.innerHTML;
      exportBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Gerando...`;
      exportBtn.classList.add('opacity-80');
      
      setTimeout(() => {
        exportBtn.innerHTML = originalContent;
        exportBtn.classList.remove('opacity-80');
        
        successOverlay.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          successIcon.classList.remove('scale-50');
          successIcon.classList.add('scale-100');
        }, 50);
        
        setTimeout(() => {
          successOverlay.classList.add('opacity-0', 'pointer-events-none');
          successIcon.classList.add('scale-50');
          successIcon.classList.remove('scale-100');
        }, 2500);
        
      }, 1500);
    });
  });
</script></main>

</body></html>
